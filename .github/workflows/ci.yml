name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
      - 'feat/**'
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/hotfix/') }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend & Shift-Left Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Shift-Left Pre-Flight Check
        run: python3 .agents/scripts/verify_shift_left.py
      - name: Type Check
        run: npm run type-check
      - name: Lint
        run: npm run lint:check
      - name: Frontend Unit Tests
        run: npm test

  rust:
    name: Rust & GPUI Verification
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: Configure lld-link (if available)
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (Test-Path (Join-Path $llvmBin "lld-link.exe")) {
            $llvmBin >> $env:GITHUB_PATH
            $env:PATH = "$llvmBin;$env:PATH"
          }
          $lld = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          if ($lld) {
            Write-Output "Using lld-link.exe at $($lld.Source)"
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=lld-link.exe" >> $env:GITHUB_ENV
          } else {
            Write-Output "lld-link.exe not found; falling back to default MSVC link.exe"
          }
      - name: Build GPUI Sidecar (Debug)
        run: npm run gpui:build:dev
      - name: Rust Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust Workspace Tests
        run: cargo test --workspace
      - name: Show sccache stats
        if: always()
        continue-on-error: true
        run: sccache --show-stats
