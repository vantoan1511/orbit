name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
      - 'feat/**'
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/hotfix/') }}

permissions:
  contents: read

jobs:
  verify:
    name: Shift-Left Verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: Install Dependencies
        run: npm ci
      - name: Shift-Left Pre-Flight Check
        run: python .agents/scripts/verify_shift_left.py
      - name: Type Check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Frontend Unit Tests
        run: npm test
      - name: Build GPUI Sidecar (Debug)
        run: npm run gpui:build:dev
      - name: Rust Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust Workspace Tests
        run: cargo test --workspace
