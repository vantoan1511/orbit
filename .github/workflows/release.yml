name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    if: "contains(github.event.head_commit.message, 'chore: release v') || github.event_name == 'workflow_dispatch'"
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: Install Dependencies
        run: npm ci
      - name: Build Tauri Desktop Application
        run: npm run tauri:build
      - name: Find NSIS Installer
        run: |
          $nsis = Get-ChildItem -Path @("target/release/bundle/nsis/*setup.exe", "src-tauri/target/release/bundle/nsis/*setup.exe") -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) {
            $nsis = Get-ChildItem target/release/bundle/nsis/*setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $nsis) { throw "NSIS installer not found" }
          echo "NSIS_INSTALLER_PATH=$($nsis.FullName)" >> $env:GITHUB_ENV
      - name: Verify Installer Elevation (Legacy Client Backward-Compatibility)
        run: node --experimental-strip-types scripts/verify-installer-elevation.ts $env:NSIS_INSTALLER_PATH
      - name: Get Version
        id: version
        run: |
          $version = node -p "require('./package.json').version"
          echo "VERSION=$version" >> $env:GITHUB_ENV
      - name: Create and Push Tag
        run: |
          git tag v${{ env.VERSION }}
          git push origin v${{ env.VERSION }}
        continue-on-error: true
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*setup.exe
            target/release/bundle/msi/*.msi
