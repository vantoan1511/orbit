name: Release

on:
  workflow_dispatch:
    inputs:
      make_latest:
        description: "Mark GitHub Release as latest ('auto' uses semver comparison)"
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'true'
          - 'false'
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
    tags:
      - 'v*'

jobs:
  release:
    if: "contains(github.event.head_commit.message, 'chore: release v') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')"
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Determine Release Metadata & Eligibility
        id: meta
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

          $gitRef = $env:GIT_REF
          $refName = $env:GIT_REF_NAME
          $eventName = $env:GITHUB_EVENT_NAME

          if ($gitRef.StartsWith("refs/tags/v")) {
            if ($refName -ne $expectedTag) {
              Write-Error "Pushed tag '$refName' does not match package.json version '$expectedTag'."
              exit 1
            }
          } elseif ($eventName -eq "push" -and $gitRef.StartsWith("refs/heads/")) {
            $remoteTag = git ls-remote --tags origin "refs/tags/$expectedTag"
            if (-not [string]::IsNullOrWhiteSpace($remoteTag)) {
              Write-Output "Tag $expectedTag already exists on origin. Skipping duplicate release build for branch push $gitRef."
              "should_release=false" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }

          $override = if ([string]::IsNullOrWhiteSpace($env:INPUT_MAKE_LATEST)) { "auto" } else { $env:INPUT_MAKE_LATEST.Trim() }
          $env:ORBIT_TARGET_VERSION = $version
          $env:ORBIT_MAKE_LATEST_OVERRIDE = $override

          $metaJson = node --input-type=module -e "
            import { execSync } from 'node:child_process';
            import { computeMakeLatest } from './scripts/lib/releaseHelpers.mjs';
            const tags = execSync('git tag -l \"v*\"', { encoding: 'utf8' })
              .split(/\r?\n/)
              .map((t) => t.trim())
              .filter(Boolean);
            const result = computeMakeLatest(process.env.ORBIT_TARGET_VERSION, tags, process.env.ORBIT_MAKE_LATEST_OVERRIDE);
            console.log(JSON.stringify(result));
          "
          $meta = $metaJson | ConvertFrom-Json

          Write-Output "Release metadata for $expectedTag`: should_release=true, make_latest=$($meta.makeLatest), is_prerelease=$($meta.isPrerelease)"
          "should_release=true" >> $env:GITHUB_OUTPUT
          "make_latest=$($meta.makeLatest)" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($meta.isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Install Rust
        if: steps.meta.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        if: steps.meta.outputs.should_release == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: Install Dependencies
        if: steps.meta.outputs.should_release == 'true'
        run: npm ci
      - name: Build Tauri Desktop Application
        if: steps.meta.outputs.should_release == 'true'
        run: npm run tauri:build
      - name: Find NSIS Installer
        if: steps.meta.outputs.should_release == 'true'
        run: |
          $nsis = Get-ChildItem -Path @("target/release/bundle/nsis/*setup.exe", "src-tauri/target/release/bundle/nsis/*setup.exe") -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) {
            $nsis = Get-ChildItem target/release/bundle/nsis/*setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $nsis) { throw "NSIS installer not found" }
          echo "NSIS_INSTALLER_PATH=$($nsis.FullName)" >> $env:GITHUB_ENV
      - name: Verify Installer Elevation (Legacy Client Backward-Compatibility)
        if: steps.meta.outputs.should_release == 'true'
        run: node --experimental-strip-types scripts/verify-installer-elevation.ts $env:NSIS_INSTALLER_PATH
      - name: Create and Push Tag
        if: steps.meta.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $tagName = "v${{ env.VERSION }}"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tagName"
          if (-not [string]::IsNullOrWhiteSpace($remoteTag)) {
            Write-Output "Tag $tagName already exists on origin. Skipping tag push."
            exit 0
          }
          git rev-parse -q --verify "refs/tags/$tagName" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            git tag $tagName
          }
          git push origin $tagName
      - name: Generate Release Notes
        id: notes
        if: steps.meta.outputs.should_release == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ env.VERSION }}
          TARGET_TAG: v${{ env.VERSION }}
          TARGET_COMMITISH: ${{ github.sha }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          $notesScript = @'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import {
            resolvePreviousTag,
            parseGitLogLines,
            buildFallbackReleaseNotes,
            selectReleaseNotes
          } from './scripts/lib/releaseHelpers.mjs';

          const targetVersion = process.env.TARGET_VERSION;
          const targetTag = process.env.TARGET_TAG;
          const targetCommitish = process.env.TARGET_COMMITISH;
          const repository = process.env.GITHUB_REPOSITORY_NAME;
          const token = process.env.GITHUB_TOKEN;

          const readTags = (args) =>
            execFileSync('git', args, { encoding: 'utf8' })
              .split(/\r?\n/)
              .map((t) => t.trim())
              .filter(Boolean);

          const mergedTags = readTags(['tag', '--merged', 'HEAD', '--list', 'v*']);
          const allTags = readTags(['tag', '-l', 'v*']);
          const previousTag = resolvePreviousTag(targetVersion, mergedTags, allTags);

          let generatedNotes = null;
          if (token && repository) {
            try {
              const payload = {
                tag_name: targetTag,
                target_commitish: targetCommitish,
                ...(previousTag ? { previous_tag_name: previousTag } : {})
              };
              const res = await fetch(`https://api.github.com/repos/${repository}/releases/generate-notes`, {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
              });
              if (res.ok) {
                const data = await res.json();
                generatedNotes = typeof data.body === 'string' ? data.body : null;
              } else {
                console.error(`GitHub generate-notes returned HTTP ${res.status}; using fallback if needed.`);
              }
            } catch (err) {
              console.error(`Failed to query GitHub generate-notes: ${err?.message || err}`);
            }
          }

          const rangeSpec = previousTag ? `${previousTag}..HEAD` : 'HEAD';
          const logOutput = execFileSync(
            'git',
            ['log', rangeSpec, '--no-merges', '--format=%H%x09%an%x09%s'],
            { encoding: 'utf8' }
          );
          const commits = parseGitLogLines(logOutput);
          const fallbackNotes = buildFallbackReleaseNotes({
            targetTag,
            previousTag,
            repository,
            commits
          });

          const selected = selectReleaseNotes({ generatedNotes, fallbackNotes });
          const notesPath = path.join(process.env.RUNNER_TEMP || os.tmpdir(), 'release-notes.md');
          fs.writeFileSync(notesPath, selected.body, 'utf8');
          console.error(`Release notes source: ${selected.source} (previousTag=${previousTag ?? 'none'}, commits=${commits.length})`);
          console.log(notesPath);
          '@
          $notesPath = (node --input-type=module -e $notesScript).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($notesPath)) {
            Write-Error "Failed to generate release notes."
            exit 1
          }
          "release_notes_path=$notesPath" >> $env:GITHUB_OUTPUT
      - name: Create Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          body_path: ${{ steps.notes.outputs.release_notes_path }}
          generate_release_notes: false
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: |
            target/release/bundle/nsis/*setup.exe
            target/release/bundle/msi/*.msi
