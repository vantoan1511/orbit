name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    if: "contains(github.event.head_commit.message, 'chore: release v') || github.event_name == 'workflow_dispatch'"
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Dependencies
        run: npm install
      - name: Build Tauri Desktop Application
        run: npm run tauri:build
      - name: Get Version
        id: version
        run: |
          $version = node -p "require('./package.json').version"
          echo "VERSION=$version" >> $env:GITHUB_ENV
      - name: Update Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $max_retries = 5
          $retry_count = 0
          $success = $false

          while ($retry_count -lt $max_retries) {
            git fetch origin main
            git reset --hard origin/main
            
            node scripts/generate-manifest.js
            git add update-manifest.json
            
            if (git diff --cached --quiet) {
              echo "No changes to commit"
              $success = $true
              break
            }
            
            git commit -m "chore: update manifest for v${{ env.VERSION }} [skip ci]"
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            
            echo "Push failed, retrying in 3 seconds..."
            Start-Sleep -Seconds 3
            $retry_count++
          }

          if (-not $success) {
            echo "Failed to push after $max_retries retries"
            exit 1
          }
      - name: Create and Push Tag
        run: |
          git tag v${{ env.VERSION }}
          git push origin v${{ env.VERSION }}
        continue-on-error: true
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*_setup.exe
            target/release/bundle/msi/*.msi
