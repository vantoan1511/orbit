[workspace]
members = [
    "crates/orbit-core",
    "src-tauri",
    "src-gpui"
]
resolver = "2"

[workspace.package]
version = "0.20.1"
edition = "2024"
authors = ["Toan Nguyen"]
rust-version = "1.85"

[workspace.dependencies]
orbit-core = { path = "crates/orbit-core" }
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
http = "1"
k8s-openapi = { version = "0.24.0", features = ["latest"] }
kube = { version = "0.98.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = 3          # speed up compilation (3 is faster than 'z')
lto = "thin"           # faster than full LTO, still good optimization
codegen-units = 16     # parallelize compilation for faster builds
strip = true           # keep symbols stripped for reasonable binary size
panic = "abort"        # abort on panic (smaller binary)
