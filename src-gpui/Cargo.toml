[package]
name = "orbit-gpui"
version = "0.19.1"
edition = "2024"

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
lucide-icons = "1.72"
orbit-core = { path = "../crates/orbit-core" }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
kube = { version = "0.98.0", default-features = false }
orbit-core = { path = "../crates/orbit-core", features = ["test-utils"] }

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3.6"
