[package]
name = "orbit-gpui"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-kit", version = "0.11.0" }
k8s-openapi.workspace = true
kube.workspace = true
lucide-icons = "1.72"
orbit-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui = { package = "gpui-kit", version = "0.11.0", features = ["test-support"] }
orbit-core = { workspace = true, features = ["test-utils"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3.6"

[lints]
workspace = true
