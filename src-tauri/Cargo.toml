[package]
name = "orbit-app"
version.workspace = true
description = "Orbit - Kubernetes Desktop Application"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "orbit_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orbit-core.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "fs", "io-util", "process"] }
async-trait = "0.1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
uuid.workspace = true
futures-util = "0.3"
http.workspace = true
kube = { workspace = true, default-features = true, features = ["runtime", "derive", "client", "ws"] }
portable-pty = "0.8"
k8s-openapi.workspace = true
chrono.workspace = true
base64.workspace = true
serde_yaml_ng.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "json"] }
semver = "1.0.28"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }

[dev-dependencies]
orbit-core = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true

