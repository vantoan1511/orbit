[package]
name = "orbit-app"
version = "0.14.4"
description = "Orbit - Kubernetes Desktop Application"
authors = ["Toan Nguyen"]
edition = "2024"

[lib]
name = "orbit_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
orbit-engine = { path = "../core/engine" }
