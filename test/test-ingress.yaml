apiVersion: v1
kind: Namespace
metadata:
  name: orbit-test
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-simple-ingress
  namespace: orbit-test
  labels:
    app: test-simple-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-clusterip-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-multi-host-ingress
  namespace: orbit-test
  labels:
    app: test-multi-host-ingress
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.example.com
    - web.example.com
    secretName: test-tls-secret
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: test-clusterip-service
            port:
              number: 80
  - host: web.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-nodeport-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-active-ingress
  namespace: orbit-test
  labels:
    app: test-active-ingress
spec:
  ingressClassName: haproxy
  rules:
  - host: orbit-dashboard.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-clusterip-service
            port:
              number: 80
status:
  loadBalancer:
    ingress:
    - ip: 10.0.0.150
      hostname: lb.orbit.local
